<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="在当前页面查看项目原型和 PRD。"><title>项目查看</title><link rel="stylesheet" href="../assets/viewer.css"><script src="../assets/catalog.js" defer></script><script src="../assets/portal.js" defer></script></head>
<body data-initial-project="yuanyoumao">
<header class="viewer-header"><div class="identity"><a id="projectHome" class="brand" href="./" aria-label="返回项目聚合页">PM</a><span class="divider"></span><h1 id="projectTitle"></h1><span id="featureTitle" class="feature-title"></span><span id="version" class="version"></span></div><div class="header-actions"><button id="shareButton" type="button">分享链接</button><button id="sourcesButton" class="quiet" type="button" aria-haspopup="dialog">更多资料 ⋯</button></div></header>
<main id="main">
<section id="overview" class="overview" aria-labelledby="overviewTitle"><div class="overview-heading"><div><h2 id="overviewTitle">项目内容</h2><p id="overviewSummary"></p></div><label class="overview-search"><input id="contentSearch" type="search" placeholder="搜索功能或资料" aria-label="搜索功能或资料"></label></div><div id="categoryFilters" class="category-filters" role="group" aria-label="内容类型"></div><div id="overviewCards" class="overview-cards"></div><div id="overviewEmpty" class="overview-empty" hidden><h3>暂无匹配内容</h3><p id="overviewEmptyText"></p></div></section>
<div id="contentToolbar" class="content-toolbar"><div class="viewer-navigation"><a id="backOverview" class="back-overview">← 项目内容</a><div id="viewTabs" class="tabs" role="tablist" aria-label="查看内容"></div></div><div class="toolbar-meta"><span id="contentStatus"></span><a id="downloadFile" download>下载 ↓</a></div></div>
<section id="prototypePanel" class="content-panel prototype-panel" role="tabpanel"><div id="embedFrames"></div></section>
<section id="prdPanel" class="content-panel prd-panel" role="tabpanel"  hidden><article id="documentBody" class="markdown"></article></section>
<section id="projectEmpty" class="empty project-empty" hidden><h2 id="emptyTitle"></h2><p>暂无原型或 PRD</p></section>
</main>
<dialog id="sourcesDialog" aria-labelledby="sourcesTitle"><header><h2 id="sourcesTitle">项目与历史资料</h2><button id="closeSources" type="button" aria-label="关闭更多资料">×</button></header><div class="sources-body"><section><h3>当前项目的功能</h3><nav id="featureLinks"></nav></section><section><h3>其他项目</h3><nav id="projectLinks"></nav></section><section><h3>版本来源</h3><a class="source-link" href="https://github.com/xiaocaipanzy-arch/PM/commits/main/" target="_blank" rel="noopener">查看 Git 版本记录 ↗</a></section></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<noscript>请启用 JavaScript 查看原型与 PRD。</noscript>
</body></html>
