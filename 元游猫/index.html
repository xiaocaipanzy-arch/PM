<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="在当前页面查看项目原型和 PRD。"><title>项目查看</title><link rel="stylesheet" href="../assets/project.css?v=project-sidebar-1"><script src="../assets/catalog.js?v=project-sidebar-1" defer></script><script src="../assets/project.js?v=project-sidebar-1" defer></script></head>
<body data-project-scope="yuanyoumao">
<header class="viewer-header"><div class="identity"><span class="brand">PM</span><span class="divider"></span><h1 id="projectTitle"></h1><span id="featureTitle" class="feature-title"></span><span id="version" class="version"></span></div><div class="header-actions"><button id="shareButton" type="button">分享链接</button></div></header>
<main id="main">
<section id="overview" class="project-library" aria-label="当前项目资料">
<aside class="type-sidebar" aria-label="文档类型"><div class="type-heading">文档类型</div><nav id="categoryFilters" class="type-nav" aria-label="文档类型筛选"></nav><div class="project-scope-label">仅显示当前项目资料</div></aside>
<div class="project-documents"><div class="documents-header"><div><h2 id="overviewTitle">全部资料</h2><p id="overviewSummary"></p></div><label class="overview-search"><span aria-hidden="true">⌕</span><input id="contentSearch" type="search" placeholder="搜索当前项目资料" aria-label="搜索当前项目资料"></label></div><div class="list-columns" aria-hidden="true"><span>名称</span><span>版本 / 更新</span><span></span></div><div id="overviewCards" class="document-list"></div><div id="overviewEmpty" class="overview-empty" hidden><h3>暂无匹配内容</h3><p id="overviewEmptyText"></p></div></div></section>
<div id="contentToolbar" class="content-toolbar"><div class="viewer-navigation"><a id="backOverview" class="back-overview">← 当前项目资料</a><div id="viewTabs" class="tabs" role="tablist" aria-label="查看内容"></div></div><div class="toolbar-meta"><span id="contentStatus"></span><a id="downloadFile" download>下载 ↓</a></div></div>
<section id="prototypePanel" class="content-panel prototype-panel" role="tabpanel"><div id="embedFrames"></div></section>
<section id="prdPanel" class="content-panel prd-panel" role="tabpanel"  hidden><article id="documentBody" class="markdown"></article></section>
<section id="projectEmpty" class="empty project-empty" hidden><h2 id="emptyTitle"></h2><p>暂无原型或 PRD</p></section>
</main>

<div id="toast" role="status" aria-live="polite" hidden></div>
<noscript>请启用 JavaScript 查看原型与 PRD。</noscript>
</body></html>
