    (draft.operation?'<fieldset class="change-zone"><legend>'+changeTag()+'退款方式</legend><label><input type="radio" name="mode" value="full" '+(draft.mode==='full'?'checked':'')+'>全额退款</label><label><input type="radio" name="mode" value="partial" '+(partial?'checked':'')+' '+(o.old?'disabled':'')+'>部分退款</label>'+(o.old?'<p class="muted">功能上线前订单，仅支持现有退款方式。</p>':'')+'</fieldset>':'')+
    (partial?fields([['租赁状态',o.state],['资金状态',o.fund],['购买时长',o.T+' 小时'],['订单开始时间',o.start],['预计到期时间',o.adjustedEnd??o.end],['实际结束时间',o.actual],['已使用时长',dur(o.U)],['剩余可使用',dur(o.state==='已结束'?0:Math.max(0,o.T*3600+(o.adjustment||0)*60-o.U))],['加减时记录',o.timeLog?.map(log=>log.label).join('、')||'无'],['使用依据','本笔订单有效使用区间 · 示例'],['已成功退款',money(refunded(o)?o.record.amount:0)],['处理中退款',money((busy(o)?o.record.amount:0)+(o.hold||0))],['当前可退金额',money(remaining(o))]])+'<div class="box change-zone"><h3>'+changeTag()+'部分退款试算</h3><p>'+escapeHTML(calc.line)+'</p>'+(calc.amount===0?'<small>已用扣款或资金占用导致建议金额为 0。</small>':'')+(calc.amount>0&&calc.amount<o.P?'<button data-action="suggest">填入建议金额</button>':'')+'</div>':'')+
    (draft.mode?'<div class="form">'+(partial?'<label>本次退款金额（元）<input id="amount" inputmode="decimal" value="'+escapeHTML(draft.value)+'"></label><label>退款原因<select id="reason"><option value="">请选择</option>'+reasons.map(r=>'<option '+(draft.reason===r?'selected':'')+'>'+r+'</option>').join('')+'</select></label><label>调整或核实依据<input id="basis" value="'+escapeHTML(draft.basis)+'"></label>':'<p>全额退款金额 '+money(o.P)+'</p>')+'<label>处理备注<textarea id="note">'+escapeHTML(draft.note)+'</textarea></label></div>':'')+
    '<p class="notice error" role="alert">'+escapeHTML(message)+'</p><div class="actions"><button data-action="close">取消</button><button class="primary" data-action="review" '+(!draft.mode?'disabled':'')+'>下一步 · 审核</button></div>',partial?'partial':draft.mode==='full'?'full':'selection');
}
function check(o,amount){
  if($('scenario').value==='denied')return '当前操作人无退款权限';
  if(o.state==='已结束'&&o.fund==='已解冻'&&o.settled&&draft.mode==='partial')return '该商家已结算，不可操作';
  if(refunded(o)||busy(o))return '本单已有退款记录，请查询原退款结果';
  if(!o.P||!remaining(o))return '当前无现金可退';
  if(!Number.isSafeInteger(amount)||amount<=0)return '请输入大于 0 且精确到分的退款金额';
  if(amount>remaining(o))return '金额超过当前可退上限 '+money(remaining(o));
  if(draft.mode==='partial'&&amount===o.P)return '退款金额等于本单实付金额，请选择全额退款';
  if(draft.mode==='partial'&&!draft.reason)return '请选择退款原因';
  if(!draft.note.trim())return '请填写处理备注';
  const calc=calculate(o);
  if(draft.mode==='partial'&&(calc.amount===null||calc.amount!==amount)&&!draft.basis.trim())return '请填写调整或核实依据';
  return '';
}
function amountFromDraft(o){
  const input=draft.value.trim();
  return draft.mode==='full'?o.P:/^\d+(\.\d{1,2})?$/.test(input)?Math.round(Number(input)*100):NaN;
}
function alertDialog(message,back='back'){
  openDialog('操作提醒','<p role="alert">'+escapeHTML(message)+'</p><div class="actions"><button class="primary" data-action="'+back+'">知道了</button></div>');
}
function confirmRefund(){
  const o=find(draft.id),amount=amountFromDraft(o),error=check(o,amount);
  if(error){if(o.settled&&draft.mode==='partial')alertDialog(error);else form(error);return;}
  draft.amount=amount;
  reviewAction=$('scenario').value;
  openDialog('确认退款',fields([['订单号',orderNo(o)],['收款渠道','原支付渠道（模拟）'],['退款方式',draft.mode==='partial'?'部分退款':'全额退款'],['本次退款金额',money(amount)],['累计已退金额',money(0)],['退款后结算金额',money(o.P-amount)],['退款原因',draft.reason||'—'],['处理备注',draft.note]])+
    '<p class="box">'+(o.state==='已结束'?'保留原实际结束时间。':'退款成功后结束本笔订单，其余订单维持原定时间。')+'</p><div class="actions"><button data-action="back">返回修改</button><button class="primary" data-action="submit">确认提交</button></div>','review');
}
function refreshResult(o,result){
  const r=o.record;
  r.status={success:'成功',pending:'处理中',failure:'失败',unknown:'待核查'}[result];
  r.channel={success:'渠道确认退款成功',pending:'渠道已受理',failure:'渠道明确拒绝，已释放金额占用',unknown:'响应超时，金额继续占用'}[result];
  if(result==='success'){
    r.completed='2026-11-19 12:00:00（模拟）';
    o.actual ||= '2026-11-19 12:00:00';
    o.state='已结束';
  }
}
function submit(){
  const o=find(draft.id), mode=reviewAction;
  if(mode==='settled'&&draft.mode==='partial'){
    o.state='已结束';o.actual||='2026-11-19 12:00:00';o.fund='已解冻';o.settled=true;
  }
  if(mode==='newer'&&!orders.some(x=>x.id===o.id+1000)){
    orders.unshift({...o,id:o.id+1000,renew:true,U:0,state:'等待开始',record:undefined,actual:undefined,settled:false,fund:'冻结中'});
  }
  if(mode==='balance')o.hold=o.P;
  const error=check(o,draft.amount);
  if(error){render();alertDialog(mode==='balance'?'可退金额已变化，请重新确认。当前可退 '+money(remaining(o)):error);return;}
  if(orders.some(x=>x.id>o.id&&x.account===o.account&&!refunded(x))){
    alertDialog('当前订单不是该用户在此账号下的最后一单。请按倒序处理最新订单。','close');return;
  }
  const calc=calculate(o);
  o.record={id:o.record?.id??'RF-DEMO-'+o.id,mode:draft.mode,amount:draft.amount,reason:draft.reason||'人工全额退款',note:draft.note,basis:draft.basis,calculation:draft.mode==='partial'?calc.line:'现有全额退款流程示意',started:'2026-11-19 12:00:00（模拟）'};
  logOrderOperation(o,draft.mode==='partial'?'部分退款':'退款',o.record.note);
  refreshResult(o,['success','pending','failure','unknown'].includes(mode)?mode:'success');
  modal.close();
  render('退款'+o.record.status+' · '+orderNo(o)+' · '+o.record.channel);
}
document.addEventListener('input',event=>{
  const keys={minutes:'minutes',amount:'value',reason:'reason',note:'note',basis:'basis'};
  const key=keys[event.target.id];
  if(draft&&key)draft[key]=event.target.value;
});
document.addEventListener('change',event=>{
  if(event.target.id==='order-page-size'){pageSize=Number(event.target.value);orderPage=1;render();}

  if(event.target.name==='operation'){draft.operation=event.target.value;form();}
  if(event.target.name==='mode'){draft.mode=event.target.value;form();}
});
document.addEventListener('submit',event=>{
  if(event.target.id!=='filters')return;
  event.preventDefault();
  const data=new FormData(event.target);
  criteria=Object.fromEntries([...data].map(([key,value])=>[key,value.trim()]));orderPage=1;render();
});
document.addEventListener('click',event=>{
  const b=event.target.closest('button');if(!b)return;
  const {action,id,value}=b.dataset;
  if(b.id==='reset'){orders=structuredClone(seed);criteria={query:'',state:'',fund:''};$('scenario').value='success';render('已重置示例订单');return;}
  if(action==='locate-guide'){
    const scope=b.closest('.annotated');
    scope.querySelector('[data-annotation-active]')?.removeAttribute('data-annotation-active');
    const target=scope.querySelector(b.dataset.selector);
    if(target){
      const highlight=target.closest('label')||target;
      highlight.setAttribute('data-annotation-active','');
      target.scrollIntoView({block:'nearest',inline:'nearest'});
      target.focus({preventScroll:true});
    }else{
      b.textContent='当前步骤暂无对应操作';
    }
  }
  if(action==='toggle-guide'){guideEnabled=!guideEnabled;render();}
  if(action==='surface'){surface=value;criteria={query:'',state:'',fund:''};orderPage=1;render();}
  if(action==='clear'){criteria={query:'',state:'',fund:''};orderPage=1;render();}
  if(action==='detail'){
    if(surface!=='player')operationRecords(find(id));
    else detail(find(id));
  }
  if(action==='refund-detail')detail(find(id));
  if(action==='handoff'){
    surface=value;
    criteria={query:orderNo(find(id)),state:'',fund:''};
    render();
    if(surface==='merchant')operationRecords(find(id));
    else detail(find(id));
  }
  if(action==='export')exportOrders();
  if(action==='matches')openDialog('比赛记录',fields([['订单号',orderNo(find(id))]])+'<p>该示例订单暂无比赛记录。</p>');
  if(action==='batch-entry'){
    batchDraft={mode:'add',minutes:'',note:'',ids:filteredOrders.filter(o=>o.state==='租赁中'&&!busy(o)&&!refunded(o)).map(o=>o.id)};
    showBatch();
  }
  if(action==='batch-review')reviewBatch();
  if(action==='batch-back')showBatch();
  if(action==='batch-apply'){
    const changes=batchDraft.changes;
    changes.forEach(([o,change])=>saveTime(o,change,batchDraft.note));
    batchDraft=null;
    modal.close();
    render('已调整 '+changes.length+' 笔订单');
  }
  if(action==='order-page'){orderPage=Number(value);render();}
  if(action==='review-time')reviewTime();
  if(action==='apply-time')applyTime();
  if(action==='operate')start(find(id));
  if(action==='close')modal.close();
  if(action==='back')form();
  if(action==='suggest'){draft.value=(calculate(find(draft.id)).amount/100).toFixed(2);form();}
  if(action==='review')confirmRefund();
  if(action==='submit')submit();
  if(action==='query'){
    const o=find(id);
    openDialog('查询渠道结果','<p>原退款记录 '+o.record.id+'</p><p class="muted">选择本次模拟查询返回的结果。</p><div class="actions"><button data-action="refund-detail" data-id="'+id+'">暂不处理</button><button data-action="resolve" data-id="'+id+'" data-value="failure">明确失败</button><button class="primary" data-action="resolve" data-id="'+id+'" data-value="success">确认成功</button></div>');
  }
  if(action==='resolve'){
    const o=find(id);if(busy(o))refreshResult(o,value);render();detail(o);
  }
});
render();
</script>
</html>
