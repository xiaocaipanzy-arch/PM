03ccol>\u003c/colgroup>\u003ctbody>\u003ctr>\u003ctd rowspan=\"2\">\u003cp>登录页面\u003c/p>\u003cp>\u003c/p>\u003cp>这里用的是5E账号登录\u003c/p>\u003cp>\u003c/p>\u003c/td>\u003ctd>\u003cp>平台服务协议： \u003c/p>\u003cfigure>\u003ca href=\"../DOCX/doc01_平台服务协议0928.docx\">doc01_平台服务协议0928.docx\u003c/a>\u003c/figure>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>隐私协议：\u003c/p>\u003cfigure>\u003ca href=\"../DOCX/doc01_用户隐私协议.docx\">doc01_用户隐私协议.docx\u003c/a>\u003c/figure>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cimg src=\"../PNG/d01_01.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003c/td>\u003ctd>\u003cp>账号授权绑定（授权5E头像、名字、手机号）：\u003c/p>\u003cp>尊敬的用户： 即将为您跳转饰品驿站（第三方商城）饰品驿站中的商品和服务由杭州乐于战网络科技有限公司（以下简称该公司）为您提供，该公司为独立运营，在您继续前往饰品驿站前，请您务必全面，仔细阅读并理解本提示内容，您点击“确定”的行为将视为您对本提示内容的知悉和同意，为确保您的合法权益，5E对战平台向您做作出如下提示： 1. 您在使用饰品驿站功能前，请您务必仔细阅读并理解饰品驿站相关方发布的规则、条款等要求，在您使用饰品驿站功能时，请您务必遵守与饰品驿站相关方达成的协议文件内容； 2. 请您在饰品驿站购买商品和服务前，务必仔细确认所购商品和服务的名称、价格、数量、时间等商品信息，并按照饰品驿站规定的使用范围内使用购买的商品服务； 3. 为优化您在饰品驿站的使用体验，在您同意本提示内容的前提下，我们会将您在5E对战平台中注册账号时和使用过程中授权我们处理的以下信息向饰品驿站运营方提供，已完成商品和服务的购买、交付、售后目的：5E对战平台ID、昵称、头像、手机号、身份证号码、邮箱地址、STEAMID、STEAM交易链接、STEAM账号受信情况、上述信息用于帮助您快速注册、登陆饰品驿站，以便能够将您购买的商品和向您提供商品的使用服务 我们会督促接收方按照5E对战平台关于处理用户个人信息的目的，方式，在法律法规等强制性规定范围内处理您的上述信息。 为了保障您的权益和购物安全，请您在跳转到第三方平台前请仔细阅读并了解第三方平台相关的 《饰品驿站用户服务协议》、《饰品驿站用户隐私协议》等重要信息，谨慎进行交易。\u003c/p>\u003cp>\u003c/p>\u003cfigure>\u003ca href=\"../TXT/doc01_登陆授权协议.txt\">doc01_登陆授权协议.txt\u003c/a>\u003c/figure>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>合同\u003c/p>\u003cp>\u003c/p>\u003c/td>\u003ctd>\u003cp>合同模板（富友需求，咱们与商户的合同）：富友需求文档：http://47.96.154.194/fuiouOrdupApipay/jie-kou-lie-biao/kai-ji-zhang-hu.html\u003c/p>\u003cp>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cimg src=\"../PNG/d01_03.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003c/td>\u003ctd>\u003cp>上传提示：\u003c/p>\u003cp>饰品驿站仅支持上传红锁/VAC且可以通过邮箱令牌登录的账号，请勿上传正常账号。上传前，请确保公开库存信息（无法公开请忽略），且账号内有有价值的饰品。不满足上述情况的账号将不予通过。\u003c/p>\u003cp>已上传账号将于24小时内完成审核，已过审账号请前往“账号配置”内配置账号信息并上架，审核通过的账号仅可在饰品驿站租赁使用，请勿在账号上架期间修改密码、修改邮箱令牌、登录该账号，由于商家违规操作产生的问题，由商家自行承担，多次违规将封禁商家端权限。\u003c/p>\u003cp>饰品驿站将最大限度保障商户的账号安全及饰品不被改动，出租过程中若存在饰品变动或丢失。饰品驿站概不负责。\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cimg src=\"../PNG/d01_02.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003c/td>\u003ctd>\u003cp>平台服务协议：\u003c/p>\u003cfigure>\u003ca href=\"../DOCX/doc01_平台服务协议0928副本.docx\">doc01_平台服务协议0928副本.docx\u003c/a>\u003c/figure>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cimg src=\"../PNG/d01_05.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>、\u003c/p>\u003c/td>\u003ctd>\u003cp>邮件转发：\u003c/p>\u003cp>QQ邮箱：\u003c/p>\u003cimg src=\"../PNG/d01_07.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>升级到QQ邮箱最新版本（已升级请忽略）\u003c/p>\u003cimg src=\"../PNG/d01_08.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>\u003c/p>\u003cp>1.点击右上角“设置”。2.点击侧导航“发信设置”。3.点击“邮件自动转发”。4.输入上方邮箱。5.点击“发送邮件”确认并进行身份验证。验证成功后，点击弹窗内“我已验证”按钮。\u003c/p>\u003cimg src=\"../PNG/d01_09.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>身份验证成功后，点击“我已验证”按钮即可。\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>\u003c/p>\u003c/td>\u003ctd>\u003cp>163邮箱：\u003c/p>\u003cimg src=\"../PNG/d01_06.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>1.点击“设置”。2.点击侧导航“常规设置”。3.点击勾选“自动转发-启用”。4.输入上方邮箱。5.点击“确认”按钮并进行身份验证即可。\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cimg src=\"../PNG/d01_04.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003c/td>\u003ctd>\u003cp>提现需知：\u003c/p>\u003cp>1.单笔可提现最低金额￥100，目前仅支持全部提现，以实际限额为准。\u003c/p>\u003cp>2.每笔提现收取1%手续费，上不封顶。\u003c/p>\u003cp>3.每日最多提现3次，每日0点重置次数。\u003c/p>\u003cp>4.预计48小时内到账，具体时间取决于收款银行，正常会在每天08:30，12:30，16:30，22:30打款，可能出现延迟到账，请留意到账情况。提现可能拆成多笔打款，以实际提现到账为准。\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>第三方共享清单\u003c/p>\u003cp>\u003c/p>\u003c/td>\u003ctd>\u003cp>\u003c/p>\u003cfigure>\u003ca href=\"../TXT/doc01_第三方信息共享清单.txt\">doc01_第三方信息共享清单.txt\u003c/a>\u003c/figure>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>\u003c/p>\u003c/article>", "text": "饰品驿站-商家端-协议/信息补充确认\n登录页面\n这里用的是5E账号登录\n平台服务协议：\ndoc01_平台服务协议0928.docx\n隐私协议：\ndoc01_用户隐私协议.docx\n账号授权绑定（授权5E头像、名字、手机号）：\n尊敬的用户： n自动退款：\n单一用户在单一子订单开始30分钟内，点击“一键上号”，连续三次上号失败，触发自动退款，自动退款逻辑与支付并发的退款逻辑一致。后台展示已退款(系统)。前台也展示已退款。", "revision": 124}, {"id": 3, "version": 9, "title": "上号失败状态细化-Steam版本不符", "html": "\u003carticle>\u003ch3>上号失败状态细化-Steam版本不符\u003c/h3>\u003cimg src=\"../PNG/d03_01.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>点击“一键上号”按钮，当上号失败原因为Steam版本不符时，弹出“以上上号失败”弹窗。\u003c/p>\u003cp>点击“下载按钮”打开浏览器进入指定下载链接：https://media.st.dl.eccdnx.com/client/installer/SteamSetup.exe\u003c/p>\u003cimg src=\"../PNG/d03_02.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>其它上号失败，若能获取到错误码，则在文案最后增加错误码展示。\u003c/p>\u003cp>\u003c/p>\u003cp>错误码\u003c/p>\u003cp>enum steam_login_status :int {\u003c/p>\u003cp>    login_status_ok = 0,\u003c/p>\u003cp>    login_error_internal = -1,              // 内部错误\u003c/p>\u003cp>    login_error_not_find_wnd1 = -2,         // 没有找到一级窗口\u003c/p>\u003cp>    login_error_not_find_wnd2 = -3,         // 没有找到登录窗口\u003c/p>\u003cp>    login_error_caputre = -4,               // 截图失败\u003c/p>\u003cp>    login_error_not_find_qr = -5,           // 截图没有识别到二维码\u003c/p>\u003cp>    login_error_timeout = - 6,              // 登录超时\u003c/p>\u003cp>    login_error_steampath = -7,             // steam路径异常\u003c/p>\u003cp>    login_error_loginserver = -8,           // 上号服务器异常\u003c/p>\u003cp>    login_error_steamstart = -9,            // steam启动异常\u003c/p>\u003cp>    login_error_qrurl = -10,                // 二维码解码异常\u003c/p>\u003cp>    login_error_local_network = -11,        // 本地网络异常\u003c/p>\u003cp>    login_error_loginrefuse = -12,          // 服务器拒绝上号\u003c/p>\u003cp>    login_error_steam_exit = -13,           // steam意外退出\u003c/p>\u003cp>    login_error_lanuch_cs2_timeout = -14,   // cs2 启动超时\u003c/p>\u003cp>    login_error_server_login_type = -15,    // 服务器获取登陆类型失败\u003c/p>\u003cp>    login_error_server_login_passwd = -16,  // 服务器获取账号密码失败\u003c/p>\u003cp>    login_error_steam_vesrion = -17,        // steam版本过低\u003c/p>\u003cp>};\u003c/p>\u003cp>\u003c/p>\u003c/article>", "text": "上号失败状态细化-Steam版本不符\n点击“一键上号”按钮，当上号失败原因为Steam版本不符时，弹出“以上上号失败”弹窗。\n点击“下载按钮”打开浏览器进入指定下载链接：https://media.st.dl.eccdnx.com/client/installer/SteamSetup.exe\n其它上号失败，若能获取到错误码，则在文案最后增加错误码展示。\n错误码\nenum steam_login_status :int {\nlogin_status_ok = 0,\nlogin_error_internal = -1,              // 内部错误\nlogin_error_not_find_wnd1 = -2,         // 没有找到一级窗口\nlogin_error_not_find_wnd2 = -3,         // 没有找到登录窗口\nlogin_error_caputre = -4,               // 截图失败\nlogin_error_not_find_qr = -5,           // 截图没有识别到二维码\nlogin_error_timeout = - 6,              // 登录超时\nlogin_error_steampath = -7,             // steam路径异常\nlogin_error_loginserver = -8,           // 上号服务器异常\nlogin_error_steamstart = -9,            // steam启动异常\nlogin_error_qrurl = -10,                // 二维码解码异常\nlogin_error_local_network = -11,        // 本地网络异常\nlogin_error_loginrefuse = -12,          // 服务器拒绝上号\nlogin_error_steam_exit = -13,           // steam意外退出\nlogin_error_lanuch_cs2_timeout = -14,   // cs2 启动超时\nlogin_error_server_login_type = -15,    // 服务器获取登陆类型失败\nlogin_error_server_login_passwd = -16,  // 服务器获取账号密码失败\nlogin_error_steam_vesrion = -17,        // steam版本过低\n};", "revision": 116}, {"id": 4, "version": 22, "title": "锦标赛禁止租号", "html": "\u003carticle>\u003ch3>锦标赛禁止租号\u003c/h3>\u003ch3>前台-锦标赛\u003c/h3>\u003cimg src=\"../PNG/d04_01.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cimg src=\"../PNG/d04_02.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>点击“加入房间”按钮（我的比赛页、弹窗）：\u003c/p>\u003cp>判断本地登录的Steam账号与报名的Steam账号是否一致。（报名用的是用户原steam账号）\u003c/p>\u003cp> - 一致：正常进入房间。\u003c/p>\u003cp> - 不一致（不存在租赁中的账号）：吐司提示，请使用报名时的Steam账号进行比赛。\u003c/p>\u003cp> - 不一致（存在租赁中的账号）：吐司提示，请使用报名时的Steam账号进行比赛，若当前为租赁账号，请前往饰品驿站-我的订单-切换账号。\u003c/p>\u003cp>\u003c/p>\u003cp>当用租赁账号连接锦标赛服务器时，直接踢出来（锦标赛服务器仅绑定用户自己的SteamID）\u003c/p>\u003ch3>前台-账号详情-共享需知\u003c/h3>\u003cimg src=\"../PNG/d04_03.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>新增一条：\u003c/p>\u003cp>7.饰品驿站商品不支持锦标赛，若使用饰品驿站商品导致比赛出现异常，请以赛事方判定为准，平台不承担任何责任。\u003c/p>\u003cp>\u003c/p>\u003c/article>", "text": "锦标赛禁止租号\n前台-锦标赛\n点击“加入房间”按钮（我的比赛页、弹窗）：\n判断本地登录的Steam账号与报名的Steam账号是否一致。（报名用的是用户原steam账号）\n- 一致：正常进入房间。\n- 不一致（不存在租赁中的账号）：吐司提示，请使用报名时的Steam账号进行比赛。\n- 不一致（存在租赁中的账号）：吐司提示，请使用报名时的Steam账号进行比赛，若当前为租赁账号，请前往饰品驿站-我的订单-切换账号。\n当用租赁账号连接锦标赛服务器时，直接踢出来（锦标赛服务器仅绑定用户自己的SteamID）\n前台-账号详情-共享需知\n新增一条：\n7.饰品驿站商品不支持锦标赛，若使用饰品驿站商品导致比赛出现异常，请以赛事方判定为准，平台不承担任何责任。", "revision": 125}, {"id": 5, "version": 23, "title": "租号到期插件提示", "html": "\u003carticle>\u003ch3>租号到期插件提示\u003c/h3>\u003cp>模式ID：4、7、1、23、102、194、18、38、19、6、24、103、29、28、30、1821、1822、1823\u003c/p>\u003cp>（跟原来模式一样，没改）\u003c/p>\u003cp>当租赁账号在以上模式游戏中，且租赁剩余10分钟/超时15分钟/超时30分钟时，插件在聊天框给该用户推送消息（红色文字）。\u003c/p>\u003cp>剩余10分钟：当前账号剩余10分钟，为不影响体验，请及时续租。\u003c/p>\u003cp>超时15分钟：当前账号已超时15分钟，为不影响体验，请及时续租。\u003c/p>\u003cp>超时30分钟：当前账号已超时30分钟，为不影响体验，请及时续租。\u003c/p>\u003cp>\u003c/p>\u003c/article>", "text": "租号到期插件提示\n模式ID：4、7、1、23、102、194、18、38、19、6、24、103、29、28、30、1821、1822、1823\n（跟原来模式一样，没改）\n当租赁账号在以上模式游戏中，且租赁剩余10分钟/超时15分钟/超时30分钟时，插件在聊天框给该用户推送消息（红色文字）。\n剩余10分钟：当前账号剩余10分钟，为不影响体验，请及时续租。\n超时15分钟：当前账号已超时15分钟，为不影响体验，请及时续租。\n超时30分钟：当前账号已超时30分钟，为不影响体验，请及时续租。", "revision": 18}, {"id": 6, "version": 27, "title": "租赁账号下架后号商可登录", "html": "\u003carticle>\u003ch3>租赁账号下架后号商可登录\u003c/h3>\u003ch6>商家端-账号管理-操作-上下架\u003c/h6>\u003cimg src=\"../PNG/d06_01.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>后两个感叹号文案新增/修改。\u003c/p>\u003cp>若账号处于租赁中状态，操作后不会影响正常租赁中的订单，当订单结束或用户续租时，会展示新的配置信息。\u003c/p>\u003cp>“红锁”账号“下架”且处于“未租赁”状态时，该账号可正常登录5E对战平台。当账号在5E对战平台为非登录状态时，才能重新上架。请合理操作。\u003c/p>\u003ch6>后台-租赁账号管理-状态操作-上下架\u003c/h6>\u003cimg src=\"../PNG/d06_02.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003ch6>商家端/后台自营-账号管理-操作-上下架\u003c/h6>\u003cimg src=\"../PNG/d06_03.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>后两行文案新增/修改。\u003c/p>\u003cp>若账号处于租赁中状态，操作后不会影响正常租赁中的订单，当订单结束或用户续租时，会展示新的配置信息。\u003c/p>\u003cp>“红锁”账号“下架”且处于“未租赁”状态时，该账号可正常登录5E对战平台。当账号在5E对战平台为非登录状态时，才能重新上架。请合理操作。\u003c/p>\u003cp>\u003c/p>\u003cp>交互：\u003c/p>\u003cp>1.点击“确定/保存信息”按钮：\u003c/p>\u003cp> ⑴若操作为“上架”：判断当前租赁账号绑定的原5E账号是否为平台登录状态：\u003c/p>\u003cul>\u003cli>登录状态：吐司提示：该账号绑定的原5E账号为登录平台状态，无法上架。\u003c/li>\u003cli>非登录状态：正常上架,调接口把账号状态改启用（白哥做的那个后台页面里的启用）。\u003c/li>\u003c/ul>\u003cp>⑵若操作为“下架”判断当前租赁账号是否为租赁状态：\u003c/p>\u003cul>\u003cli>租赁中（包含延时下号）：正常下架，等待租赁下号后调接口把账号状态改停用（白哥做的那个后台页面里的停用）\u003c/li>\u003cli>未租赁：正常下架，调接口把账号状态改停用（白哥做的那个后台页面里的停用）\u003c/li>\u003c/ul>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cimg src=\"../PNG/d06_04.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>\u003c/p>\u003c/article>", "text": "租赁账号下架后号商可登录\n商家端-账号管理-操作-上下架\n后两个感叹号文案新增/修改。\n若账号处于租赁中状态，操作后不会影响正常租赁中的订单，当订单结束或用户续租时，会展示新的配置信息。\n“红锁”账号“下架”且处于“未租赁”状态时，该账号可正常登录5E对战平台。当账号在5E对战平台为非登录状态时，才能重新上架。请合理操作。\n后台-租赁账号管理-状态操作-上下架\n商家端/后台自营-账号管理-操作-上下架\n后两行文案新增/修改。\n若账号处于租赁中状态，操作后不会影响正常租赁中的订单，当订单结束或用户续租时，会展示新的配置信息。\n“红锁”账号“下架”且处于“未租赁”状态时，该账号可正常登录5E对战平台。当账号在5E对战平台为非登录状态时，才能重新上架。请合理操作。\n交互：\n1.点击“确定/保存信息”按钮：\n⑴若操作为“上架”：判断当前租赁账号绑定的原5E账号是否为平台登录状态：\n登录状态：吐司提示：该账号绑定的原5E账号为登录平台状态，无法上架。\n非登录状态：正常上架,调接口把账号状态改启用（白哥做的那个后台页面里的启用）。\n⑵若操作为“下架”判断当前租赁账号是否为租赁状态：\n租赁中（包含延时下号）：正常下架，等待租赁下号后调接口把账号状态改停用（白哥做的那个后台页面里的停用）\n未租赁：正常下架，调接口把账号状态改停用（白哥做的那个后台页面里的停用）", "revision": 90}, {"id": 7, "version": 30, "title": "删除审核记录后号商可再次上传（换绑）", "html": "\u003carticle>\u003ch3>删除审核记录后号商可再次上传（换绑）\u003c/h3>\u003cimg src=\"../PNG/d07_01.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cimg src=\"../PNG/d07_02.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>后台-商家账号审核：\u003c/p>\u003cp>交互：\u003c/p>\u003cp>1.点击“删除”按钮，弹出二次确认弹窗。点击弹窗内“确认”按钮，删除该条审核记录。同时也删除“商家端”该条审核记录。\u003c/p>\u003cp>\u003c/p>\u003cp>删除记录后，任何号商可再次上传该Steam账号（不受Steam ID 、Steam 账号影响）。\u003c/p>\u003cp>\u003c/p>\u003cp>当新号商重新审核该账号且通过后，该Steam账号换绑至新号商。\u003c/p>\u003cp>\u003c/p>\u003cp>当该Steam账号换绑至其它号商时，清除原号商商家端-账号管理 内的该Steam账号信息。\u003c/p>\u003cp>\u003c/p>\u003cimg src=\"../PNG/d07_03.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>商家端-账号管理内的Steam账号的完结订单、账号收入，计算方式以 “号商ID+账号ID” 统计。后台依旧按账号ID维度计算。\u003c/p>\u003cp>\u003c/p>\u003cimg src=\"../PNG/d07_04.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>当Steam账号被换绑后，原号商该Steam账号下的订单内的 租号ID字体为黑色，无法跳转。\u003c/p>\u003cp>\u003c/p>\u003c/article>", "text": "删除审核记录后号商可再次上传（换绑）\n后台-商家账号审核：\n交互：\n1.点击“删除”按钮，弹出二次确认弹窗。点击弹窗内“确认”按钮，删除该条审核记录。同时也删除“商家端”该条审核记录。\n删除记录后，任何号商可再次上传该Steam账号（不受Steam ID 、Steam 账号影响）。\n当新号商重新审核该账号且通过后，该Steam账号换绑至新号商。\n当该Steam账号换绑至其它号商时，清除原号商商家端-账号管理 内的该Steam账号信息。\n商家端-账号管理内的Steam账号的完结订单、账号收入，计算方式以 “号商ID+账号ID” 统计。后台依旧按账号ID维度计算。\n当Steam账号被换绑后，原号商该Steam账号下的订单内的 租号ID字体为黑色，无法跳转。", "revision": 239}, {"id": 8, "version": 34, "title": "低价值账号排序特殊处理", "html": "\u003carticle>\u003ch3>低价值账号排序特殊处理\u003c/h3>\u003ch2>账号池：\u003c/h2>\u003ch6>高价值账号池：\u003c/h6>\u003cp>小时租：小时租价格＞0.5元 且 可用饰品价值＞10000元\u003c/p>\u003cp>天租：天租价格＞5元 且 可用饰品价值＞10000元\u003c/p>\u003ch6>其它账号池账号：\u003c/h6>\u003cp>剩余所有账号。\u003c/p>\u003cp>\u003c/p>\u003ch6>默认排序规则（只影响默认排序，不影响排序/筛选操作后的结果、天租、小时租独立排序）：\u003c/h6>\u003cp>高价值账号池排序永远在其它账号池上方。两个号池独立按照性价比排序。\u003c/p>\u003cp>当在“包时段”时间段时，也是两个号池独立排序。\u003c/p>\u003cp>\u003c/p>\u003c/article>", "text": "低价值账号排序特殊处理\n账号池：\n高价值账号池：\n小时租：小时租价格＞0.5元 且 可用饰品价值＞10000元\n天租：天租价格＞5元 且 可用饰品价值＞10000元\n其它账号池账号：\n剩余所有账号。\n默认排序规则（只影响默认排序，不影响排序/筛选操作后的结果、天租、小时租独立排序）：\n高价值账号池排序永远在其它账号池上方。两个号池独立按照性价比排序。\n当在“包时段”时间段时，也是两个号池独立排序。", "revision": 175}, {"id": 9, "version": 46, "title": "租赁开关增加开关类型", "html": "\u003carticle>\u003ch3>租赁开关增加开关类型\u003c/h3>\u003cimg src=\"../PNG/d09_01.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>新增：可租赁账号类型：多选，未勾选的可租赁账号类型不会展示在前台租号列表内，收藏、账号详情页内，显示为“已下架”状态。\u003c/p>\u003cp>新增：可租赁上号方式：多选，未勾选的上号方式的账号不会展示在前台租号列表内，收藏、账号详情页内，显示为“已下架”状态。\u003c/p>\u003cimg src=\"../PNG/d09_02.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cimg src=\"../PNG/d09_03.png\" alt=\"历史文档原图\" loading=\"lazy\">\u003cp>后台、商家端 steam状态细化：正常、交易封禁、游戏封禁、社区封禁、红锁、VAC。\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cb>VAC Ban（VAC封禁）\u003c/b>\u003cbr>\u003cb>Game Ban（游戏封禁）\u003c/b>\u003cbr>\u003cb>Trade Ban（交易封禁）\u003c/b>\u003cbr>\u003cb>Community Ban（社区封禁）\u003c/b>\u003cbr>\u003cb>Account Lock（账户锁定/红锁）\u003c/b>\u003c/p>\u003cp>\u003c/p>\u003c/article>", "text": "租赁开关增加开关类型\n新增：可租赁账号类型：多选，未勾选的可租赁账号类型不会展示在前台租号列表内，收藏、账号详情页内，显示为“已下架”状态。\n新增：可租赁上号方式：多选，未勾选的上号方式的账号不会展示在前台租号列表内，收藏、账号详情页内，显示为“已下架”状态。\n后台、商家端 steam状态细化：正常、交易封禁、游戏封禁、社区封禁、红锁、VAC。\nVAC Ban（VAC封禁）\nGame Ban（游戏封禁）\nTrade Ban（交易封禁）\nCommunity Ban（社区封禁）\nAccount Lock（账户锁定/红锁）", "revision": 127}, {"id": 10, "version": 49, "title": "租号临时活动需求", "html": "\u003carticle>\u003ch3>租号临时活动需求\u003c/h3>\u003cp>活动时间：2026年8月13日0时0分 - 2026年8月21日0时0分（暂定）\u003c/p>\u003cp>\u003c/p>\u003cp>发放规则：活动期间，租号用户累计支付金额≥10元（以订单结束时间为准,订单结束后退款不用管）获得一个头像（头像制作中），单用户仅可获得一次。\u003c/p>\u003cp>\u003c/p>\u003cp>振超把满足金额的用户平台UID 发给平台，平台发放对应奖品。\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003c/article>", "text": "租号临时活动需求\n活动时间：2026年8月13日0时0分 - 2026年8月21日0时0分（暂定）\n发放规则：活动期间，租号用户累计支付金额≥10元（以订单结束时间为准,订单结束后退款不用管）获得一个头像（头像制作中），单用户仅可获得一次。\n振超把满足金额的用户平台UID 发给平台，平台发放对应奖品。", "revision": 122}, {"id": 11, "version": 36, "title": "搜索", "html": "\u003carticle>\u003ch3>搜索\u003c/h3>\u003ch3>搜索词库来源：\u003c/h3>\u003cp>1.该租赁账号配置的列表饰品、精选饰品中所有枪、刀、手套、探员的长名。\u003c/p>\u003cp>2.该租赁账号配置的标签。（若后台开启精确搜索商家配置标签）\u003c/p>\u003cp>\u003c/p>\u003ch3>拆词：（A、B、C、D为某一饰品拆词）\u003c/h3>\u003cp>定义：以饰品名中“丨”为分界线。分界线前方若存在括号，则分为括号外（A）、括号内（C）两个词。\u003c/p>\u003cp>分界线后面词为（B）、括号内磨损不计入。特殊模版词为（D）。\u003c/p>\u003cp>\u003c/p>\u003cp>举例：\u003c/p>\u003cp>AWP（纪念品） | 巨龙传说 (战痕累累)\u003c/p>\u003cp>拆词：AWP（A）、纪念品（C）、巨龙传说（B）\u003c/p>\u003cp>\u003c/p>\u003cp>蝴蝶刀（★） | 多普勒 (崭新出厂) - 红宝石\u003c/p>\u003cp>拆词：蝴蝶刀（A）、多普勒（B）、红宝石（D）\u003c/p>\u003cp>\u003c/p>\u003cp>AK-47（StatTrak™） | 表面淬火 (略有磨损) - T1\u003c/p>\u003cp>拆词：AK-47（A）、StatTrak™（C）、表面淬火（B）、T1（D）\u003c/p>\u003cp>\u003c/p>\u003cp>运动手套（★） | 迈阿密风云 (崭新出厂)\u003c/p>\u003cp>拆词：运动手套（A）、迈阿密风云（B）\u003c/p>\u003cp>\u003c/p>\u003cp>D 中队军官 | 新西兰特种空勤团\u003c/p>\u003cp>拆词：D 中队军官（A）、新西兰特种空勤团（B）\u003c/p>\u003cp>\u003c/p>\u003cp>老K | 专业人士\u003c/p>\u003cp>拆词：老K（A）、专业人士（B）\u003c/p>\u003ch3>通用词：\u003c/h3>\u003cp>磨损：崭新出厂、略有磨损、久经沙场、破损不堪、战痕累累。\u003c/p>\u003cp>类别：StatTrak™、纪念品\u003c/p>\u003ch3>关联映射：（后台配置，不断完善）\u003c/h3>\u003ctable>\u003ccolgroup>\u003ccol>\u003ccol>\u003ccol>\u003c/colgroup>\u003ctbody>\u003ctr>\u003ctd>\u003ch5>\u003cb>配置词\u003c/b>\u003c/h5>\u003c/td>\u003ctd>\u003ch5>\u003cb>映射\u003c/b>\u003c/h5>\u003c/td>\u003ctd>\u003ch5>\u003cb>拆词\u003c/b>\u003c/h5>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>龙狙\u003c/p>\u003c/td>\u003ctd>\u003cp>→\u003c/p>\u003c/td>\u003ctd>\u003cp>巨龙传说\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>暗金\u003c/p>\u003c/td>\u003ctd>\u003cp>→\u003c/p>\u003c/td>\u003ctd>\u003cp>StatTrak™\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>牙签\u003c/p>\u003c/td>\u003ctd>\u003cp>→\u003c/p>\u003c/td>\u003ctd>\u003cp>短剑\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>粉宝石\u003c/p>\u003c/td>\u003ctd>\u003cp>→\u003c/p>\u003c/td>\u003ctd>\u003cp>P2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>刀\u003c/p>\u003c/td>\u003ctd>\u003cp>→\u003c/p>\u003c/td>\u003ctd>\u003cp>求生匕首\u003c/p>\u003cp>猎杀者匕首\u003c/p>\u003cp>系绳匕首\u003c/p>\u003cp>流浪者匕首\u003c/p>\u003cp>骷髅比赛\u003c/p>\u003cp>暗影双匕\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>狙\u003c/p>\u003c/td>\u003ctd>\u003cp>→\u003c/p>\u003c/td>\u003ctd>\u003cp>AWP\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>大狙\u003c/p>\u003c/td>\u003ctd>\u003cp>→\u003c/p>\u003c/td>\u003ctd>\u003cp>AWP\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>吹风机\u003c/p>\u003c/td>\u003ctd>\u003cp>→\u003c/p>\u003c/td>\u003ctd>\u003cp>MAC-10\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>三幻神\u003c/p>\u003c/td>\u003ctd>\u003cp>→\u003c/p>\u003c/td>\u003ctd>\u003cp>M9刺刀\u003c/p>\u003cp>蝴蝶刀\u003c/p>\u003cp>爪子刀\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>蓝顶\u003c/p>\u003c/td>\u003ctd>\u003cp>→\u003c/p>\u003c/td>\u003ctd>\u003cp>T1\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>红苍蝇\u003c/p>\u003c/td>\u003ctd>\u003cp>→\u003c/p>\u003c/td>\u003ctd>\u003cp>D 中队军官\u003cbr>新西兰特种空勤团\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>……\u003c/p>\u003c/td>\u003ctd>\u003cp>……\u003c/p>\u003c/td>\u003ctd>\u003cp>……\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u function renderHistory(){
 $('listhead').textContent='历史复盘 · 57 条记录 / 35 份RP';$('list').innerHTML='<div class="empty">按源表顺序归纳。源表无发布日期；能力投入方向交错推进。</div>';
 $('detail').innerHTML=`<div class="detailhead"><div class="meta">历史资料分析 · 不代表当前线上状态或业务效果</div><h2>历史版本更新的侧重点和方向</h2><p>从商家供给与基础链路，逐步推进到履约稳定、经营数据、支付订单基础及可配置运营。各条线并行迭代。</p></div><div class="panel"><div class="stage-grid">${D.review.stages.map(s=>`<article><span class="meta">源表 ${esc(s.range)}</span><h3>${esc(s.title)}</h3><p>${esc(s.summary)}</p><strong>${esc(s.direction)}</strong></article>`).join('')}</div><h3>一份RP的多页，与一次更新是什么关系？</h3><div class="scopeinfo">源表的一条记录是一次被记录的需求/更新；RP可同时包含用户端、后台、商家端、弹窗、状态、规则说明、复用页面与暂缓页。<b>199个节点不表示199次更新，也不证明每页都在该次更新中发生变化。</b><br>文件关联：33条蓝湖链接按文件标识匹配；收藏按相同页面标识关联现有同名文件，旧版一致性未验证；0元租是项目补充，源表状态仍为规划中。</div><h3>逐次更新的侧重点</h3><div class="history-table"><table><thead><tr><th>更新记录</th><th>侧重点（分析归纳）</th><th>关联原型</th></tr></thead><tbody>${D.versions.filter(v=>(!$('status').value||v.status===$('status').value)&&(!$('search').value.trim()||searchText(v).includes($('search').value.trim().toLowerCase()))).sort((a,b)=>$('order').value==='asc'?a.id-b.id:b.id-a.id).map(v=>`<tr><td><button data-jump-version="${v.id}">#${v.id} ${esc(v.name)}</button></td><td>${esc(v.focus)}</td><td>${v.protos.map(id=>'P'+id+' / '+protoById(id).pages.length+'页').join('、')||'文字或需求文档'}</td></tr>`).join('')}</tbody></table></div><p class="meta">没有前后修订差异证据的页面保持“是否本次改动未确认”。字段、价格与示例数据均以原型历史语境理解。</p></div>`;
}
function highlightNote(i,locate){
 const grid=$('readerGrid'),marker=grid?.querySelector(`[data-note-marker="${i}"]`),card=grid?.querySelector(`[data-note-card="${i}"]`),svg=$('noteConnections');if(!grid||!svg)return;
 grid.querySelectorAll('.note-card,.note-marker').forEach(e=>e.classList.remove('active'));
 if(!marker||!card){svg.innerHTML='';return}marker.classList.add('active');card.classList.add('active');
 if(locate){$('imageScroll').scrollTop=Math.max(0,marker.offsetTop-$('imageScroll').clientHeight/3);}
 if(window.innerWidth<=1000){svg.innerHTML='';return}let a=marker.getBoundingClientRect(),b=card.getBoundingClientRect(),g=grid.getBoundingClientRect(),viewport=$('imageScroll').getBoundingClientRect();if(a.bottom<viewport.top||a.top>viewport.bottom){svg.innerHTML='';return}
 let x=a.right-g.left,y=a.top+a.height/2-g.top,x2=b.left-g.left,y2=b.top+Math.min(b.height/2,40)-g.top;svg.innerHTML=`<path d="M${x},${y} C${x+30},${y} ${x2-30},${y2} ${x2},${y2}" fill="none" stroke="#cc8a20" stroke-width="2"/>`;
}
document.addEventListener('pointerover',e=>{let n=e.target.closest('[data-note-card]');if(n)highlightNote(n.dataset.noteCard,false)});
document.addEventListener('click',e=>{let n=e.target.closest('[data-locate-note]');if(n){highlightNote(n.dataset.locateNote,true);return}if(e.target.closest('[data-reader-toggle]'))$('readerGrid').classList.toggle('picture-only');let j=e.target.closest('[data-jump-version]');if(j){let v=D.versions.find(v=>v.id===Number(j.dataset.jumpVersion));state.module=v.module;chooseVersion(v.id)}});

function renderLibrary(){let q=$('search').value.trim().toLowerCase();let ps=D.prototypes.filter(p=>!q||[p.name,...p.pages.flatMap(x=>[x.name,x.text])].join(' ').toLowerCase().includes(q));if(!ps.some(p=>'p'+p.id===String(state.id))){state.id=ps[0]?'p'+ps[0].id:null;resetPage();}$('listhead').textContent=`完整原型库 · ${ps.length}/35 份`;$('list').innerHTML=ps.map(p=>`<button class="record ${'p'+p.id===state.id?'on':''}" data-proto="${p.id}"><small>P${p.id} · ${esc(p.module)}</small><strong>${esc(p.name)}</strong><div class="meta">${p.pages.length} 个页面节点${p.versions.length?' · 关联 #'+p.versions.join(' / #'):' · 项目补充文件'}</div></button>`).join('');let p=ps.find(p=>'p'+p.id===state.id);if(!p){$('detail').innerHTML='<div class="empty">没有匹配的原型。</div>';return}$('detail').innerHTML=`<div class="detailhead"><div class="meta">原型库 / ${esc(p.module)}</div><h2>${esc(p.name)}</h2><div class="meta">${p.versions.length?'关联版本 #'+p.versions.join(' / #'):'项目补充资料，具体版本未确认'}</div></div><div class="panel" id="panel"></div>`;renderPrototype(p);}
function renderBacklog(){let q=$('search').value.trim().toLowerCase();let bs=D.backlog.filter(b=>(b.name+b.note).toLowerCase().includes(q));$('listhead').textContent='需求池 · '+bs.length+' 条';$('list').innerHTML='<div class="empty">优先级与备注沿用源表。<br>未推定当前排期或交付状态。</div>';$('detail').innerHTML=`<div class="detailhead"><div class="meta">源表 / 需求池</div><h2>后续需求与待办</h2></div><div class="panel backlog">${bs.map(b=>`<article><h3>${tag(b.priority)}${esc(b.name)}</h3><div class="meta">${esc(b.note||'源表无备注')}</div></article>`).join('')}</div>`;}
function chooseVersion(id){state.id=Number(id);resetPage();let v=D.versions.find(v=>v.id===state.id);state.tab=v?.protos.length?'prototype':'document';if(v?.protos.length)state.page=firstContent(protoById(v.protos[0]));render();}
document.addEventListener('click',e=>{let m=e.target.closest('[data-module]');if(m){state.module=m.dataset.module;state.id=null;resetPage();render();return}let v=e.target.closest('[data-version]');if(v){chooseVersion(v.dataset.version);return}let p=e.target.closest('[data-proto]');if(p){state.id='p'+p.dataset.proto;resetPage();render();return}let t=e.target.closest('[data-tab]');if(t){state.tab=t.dataset.tab;render();return}let step=e.target.closest('[data-page-step]');if(step){state.page+=Number(step.dataset.pageStep);state.module==='原型库'?renderLibrary():renderVersion(D.versions.find(v=>v.id===state.id));return}let image=e.target.closest('img[data-zoom],.doc img');if(image){$('zoomimage').src=image.getAttribute('data-zoom')||image.getAttribute('src');$('zoomtitle').textContent=image.alt;$('zoomscroll').classList.remove('original');$('zoom').showModal();$('zoomclose').focus();}});
document.addEventListener('change',e=>{if(e.target.id==='pageSelect'){state.page=Number(e.target.value);state.module==='原型库'?renderLibrary():renderVersion(D.versions.find(v=>v.id===state.id));}});
$('search').addEventListener('input',()=>{resetPage();render()});$('status').addEventListener('change',()=>{resetPage();render()});$('order').addEventListener('change',render);$('zoomclose').onclick=()=>$('zoom').close();$('zoomfit').onclick=()=>$('zoomscroll').classList.remove('original');$('zoomoriginal').onclick=()=>$('zoomscroll').classList.add('original');$('zoom').addEventListener('click',e=>{if(e.target===$('zoom'))$('zoom').close()});
const journeyState={role:D.journeys.defaultRole,step:null,key:null,lastMain:null};
function activeJourneyRole(){return D.journeys.roles.find(r=>r.id===journeyState.role)||D.journeys.roles[0]}
function activeJourneyStep(){let r=activeJourneyRole();return r.steps.find(s=>s.id===journeyState.step)||r.steps[0]}
function journeyPageLabel(pg){let f=D.prototypes.find(f=>f.pages.some(p=>p.key===pg.key));return pg.name==='index'?f.name:readingLabel(pg)}
function journeyItem(key,group){
 if(key.startsWith('rec:')){let v=D.versions.find(v=>v.id===Number(key.slice(4)));return v?{key,record:v,v,label:v.name,group}:null;}
 if(key.startsWith('doc:')){let doc=D.documents.find(d=>d.id===Number(key.slice(4)));return doc?{key,doc,label:doc.title,v:D.versions.find(v=>v.id===doc.version),group}:null;}
 let proto=D.prototypes.find(f=>f.pages.some(p=>p.key===key));if(!proto)return null;let pg=proto.pages.find(p=>p.key===key);return {key,pg,proto,label:journeyPageLabel(pg),v:D.versions.find(v=>proto.versions.includes(v.id)),group};
}
function journeyItems(step){return step.groups.flatMap(g=>[...g.pages.map(key=>journeyItem(key,g)),...g.documents.map(id=>journeyItem('doc:'+id,g)),...(g.records||[]).map(id=>journeyItem('rec:'+id,g))]).filter(Boolean)}
function journeyHash(hash){try{if(typeof history!=='undefined'&&history.replaceState)history.replaceState(null,'',hash)}catch(e){}}
function renderViewSwitch(){
 let path=state.view==='path';$('workspace').className='workspace'+(path?' path-workspace':'');
 $('viewSwitch').innerHTML=`<div class="view-mode" role="group" aria-label="阅读方式"><button class="${path?'selected':''}" data-archive-view="path" aria-pressed="${path}">按使用路径</button><button class="${!path?'selected':''}" data-archive-view="history" aria-pressed="${!path}">按更新记录</button></div>${path?`<div class="journey-roles" role="group" aria-label="业务角色">${D.journeys.roles.map(r=>`<button data-journey-role="${r.id}" class="${r.id===journeyState.role?'selected':''}" aria-pressed="${r.id===journeyState.role}">${esc(r.name)}</button>`).join('')}</div>`:'<span class="view-caption">回顾每次更新、原型与历史变化</span>'}`;
 if(!path){$('list').className='listitems';$('detail').className='detail';$('sidebarTitle').textContent='历史模块';$('sidebarFootnote').textContent='按源表顺序回顾更新；页面与改动的关系见来源与核验。';$('notice').textContent='按功能与源表更新顺序浏览；选择页面后，左图与右侧说明同步切换。';}
}
function renderJourney(){
 let role=activeJourneyRole(),step=activeJourneyStep();journeyState.role=role.id;journeyState.step=step.id;
 let items=journeyItems(step);if(!items.some(i=>i.key===journeyState.key))journeyState.key=items[0]?.key||null;let selected=items.find(i=>i.key===journeyState.key);
 $('sidebarTitle').textContent=role.type==='tasks'?'后台工作任务':'使用步骤';$('sidebarFootnote').textContent=role.type==='tasks'?'按工作任务组织；不表示每个订单都要走完全部后台操作。':'支线是可选任务，不作为普通租赁的必经步骤。';
 let number=0;$('nav').innerHTML=role.steps.map(s=>{let n=s.branch?'支线':role.type==='tasks'?'任务':String(++number).padStart(2,'0');return `<button class="journey-step ${step.id===s.id?'on':''} ${s.branch?'branch':''}" data-journey-step="${s.id}" aria-pressed="${step.id===s.id}"><b>${n}</b><span class="journey-step-name">${esc(s.label)}</span><small>${journeyItems(s).length}</small></button>`}).join('');
 $('notice').textContent='按任务组织历史资料；同一步可查看不同历史版本，不代表一套已验收的现网流程。';
 $('listhead').innerHTML=`<span>本步骤资料</span><span class="meta">${items.filter(i=>i.pg).length} 个原型页面 · ${items.filter(i=>i.doc).length} 篇文档${items.some(i=>i.record)?' · '+items.filter(i=>i.record).length+' 条文字记录':''}</span>`;$('list').className='listitems journey-items';
 function cards(g){return journeyItems({groups:[g]}).map(i=>`<button class="journey-card ${i.key===journeyState.key?'selected':''}" data-journey-key="${esc(i.key)}" aria-pressed="${i.key===journeyState.key}">${i.pg?`<img src="${esc(i.pg.image)}" alt="" loading="lazy">`:`<span class="journey-doc-icon">${i.record?'记录':'文档'}</span>`}<span class="journey-card-text"><strong>${esc(i.label)}</strong><small>${i.pg?esc(i.proto.name):i.record?'源表文字 · 无独立原型':'需求原文'}</small><span>${i.v?`源表 #${i.v.id} · ${tag(i.v.status)}`:'项目补充资料'}</span></span></button>`).join('')}
 $('list').innerHTML=step.groups.map(g=>g.kind==='closed'?`<details class="journey-closed" ${journeyItems({groups:[g]}).some(i=>i.key===journeyState.key)?'open':''}><summary>${esc(g.label)}</summary><div class="journey-group-grid">${cards(g)}</div></details>`:`<div class="journey-group-title">${esc(g.label)}${g.kind==='plan'?'<span class="tag plan">规划资料</span>':g.kind==='support'?'<span class="journey-support-tag">辅助资料</span>':''}</div>${cards(g)}`).join('');
 let main=role.steps.filter(s=>!s.branch),at=main.findIndex(s=>s.id===step.id);let controls=step.branch?`<button data-journey-step="${journeyState.lastMain||main[0].id}">${role.type==='tasks'?'返回工作任务':'返回主线'}</button>`:`<button data-journey-step="${main[at-1]?.id||''}" ${at===0?'disabled':''}>上一步骤</button><button data-journey-step="${main[at+1]?.id||''}" ${at===main.length-1?'disabled':''}>下一步骤</button>`;
 $('detail').className='detail journey-detail';$('detail').innerHTML=`<div class="detailhead"><div class="journey-context"><div><div class="meta">${esc(role.name)}${role.type==='tasks'?'工作路径':'路径'} / ${step.branch?'可选支线':role.type==='tasks'?'工作任务':'主线资料'}</div><h2>${esc(step.label)}</h2><p class="journey-goal">${esc(step.goal)}</p></div><div class="journey-stage-controls">${controls}</div></div>${step.note?`<div class="journey-note">${esc(step.note)}</div>`:''}${step.gap?`<div class="journey-gap"><b>资料覆盖缺口</b><br>${esc(step.gap)}</div>`:''}${step.related?.length?`<div class="journey-related">${step.related.map((r,i)=>`<button data-journey-related="${i}">${esc(r.label)} →</button>`).join('')}</div>`:''}${selected?`<div class="journey-selected-source"><span>正在查看：${esc(selected.label)}${selected.v?' · 源表 #'+selected.v.id+' '+tag(selected.v.status):''}</span><button data-journey-origin>查看所属更新</button></div>`:''}${selected?.v?.id===26?`<div class="journey-note">${esc(selected.v.sourceVerification)}</div>`:''}</div><div class="panel" id="panel"></div>`;
 if(selected?.pg){state.proto=selected.proto.id;state.page=selected.proto.pages.findIndex(p=>p.key===selected.key);renderPrototype(selected.proto,selected.v)}
 else if(selected?.doc){$('panel').innerHTML=`<div class="reader-grid"><div class="doc">${selected.doc.html}</div><aside class="notes-side"><div class="notes-title">本步资料说明</div><div class="focus-card"><b>当前任务</b><p>${esc(step.goal)}</p></div><p>左侧是历史需求文档原文，不是补画的业务页面。</p>${selected.v?`<div class="focus-card"><b>关联更新侧重点（归纳）</b><p>${esc(selected.v.focus)}</p></div>`:''}${step.gap?`<div class="journey-gap">${esc(step.gap)}</div>`:''}<div class="meta">具体状态、示例值与规则按原文理解，不据此推定已上线或执行成功。</div></aside></div>${selected.v?sourceBlock(selected.v):''}`;}
 else if(selected?.record){let v=selected.record;$('panel').innerHTML=`<div class="reader-grid"><article class="doc"><h3>${esc(v.name)}</h3><p class="meta">源表第 ${v.row} 行 · ${esc(v.business)} · ${esc(v.status)}</p><div class="desc">${esc(v.description||'源表未填写说明。')}</div>${v.note?`<p>原表备注：${esc(v.note)}</p>`:''}${v.id===21?'<div class="journey-gap">此条与 #18 同名同描述，保留原表重复记录。</div>':''}<p class="meta">这是一条历史文字记录，没有独立原型画布。</p></article><aside class="notes-side"><div class="notes-title">本步资料说明</div><p>${esc(step.goal)}</p><div class="focus-card"><b>更新侧重点（归纳）</b><p>${esc(v.focus)}</p></div></aside></div>${sourceBlock(v)}`;}
 else $('panel').innerHTML='<div class="empty">本步骤尚无可直接展示的历史页面。</div>';
 journeyHash('#path/'+role.id+'/'+step.id+'/'+encodeURIComponent(journeyState.key||''));
}
function switchJourneyRole(id){if(!D.journeys.roles.some(r=>r.id===id))return;if(journeyState.role!==id){journeyState.role=id;journeyState.step=null;journeyState.key=null;journeyState.lastMain=null}state.view='path';render()}
function switchJourneyStep(id){let s=activeJourneyRole().steps.find(s=>s.id===id);if(!s)return;journeyState.step=id;journeyState.key=null;if(!s.branch)journeyState.lastMain=id;render()}
function openJourneyOrigin(){let i=journeyItems(activeJourneyStep()).find(i=>i.key===journeyState.key);if(!i?.v)return;state.view='history';state.module=i.v.module;state.id=i.v.id;resetPage();state.tab=i.doc||i.record?'document':'prototype';if(i.pg){state.proto=i.proto.id;state.page=i.proto.pages.findIndex(p=>p.key===i.key)}journeyHash('#v'+i.v.id);render()}
function switchArchiveView(view){if(!['path','history'].includes(view))return;state.view=view;if(view==='history')journeyHash('#history');render()}
document.addEventListener('click',e=>{let related=e.target.closest('[data-journey-related]');if(related){let to=activeJourneyStep().related?.[Number(related.dataset.journeyRelated)];if(to){journeyState.role=to.role;journeyState.step=to.step;journeyState.key=to.key||null;journeyState.lastMain=to.step;render()}return}let mode=e.target.closest('[data-archive-view]');if(mode){switchArchiveView(mode.dataset.archiveView);return}let role=e.target.closest('[data-journey-role]');if(role){switchJourneyRole(role.dataset.journeyRole);return}let step=e.target.closest('[data-journey-step]');if(step&&!step.disabled){switchJourneyStep(step.dataset.journeyStep);return}let page=e.target.closest('[data-journey-key]');if(page){journeyState.key=page.dataset.journeyKey;render();return}if(e.target.closest('[data-journey-origin]'))openJourneyOrigin()});
if(location.hash==='#history')state.view='history';
let initialJourney=location.hash.match(/^#path\/([^/]+)\/([^/]+)(?:\/(.*))?$/);
if(initialJourney){let r=D.journeys.roles.find(r=>r.id===initialJourney[1]);if(r){journeyState.role=r.id;let s=r.steps.find(s=>s.id===initialJourney[2]);if(s){journeyState.step=s.id;try{journeyState.key=decodeURIComponent(initialJourney[3]||'')}catch(e){journeyState.key=null}}}}

let hash=location.hash.match(/^#v(\d+)$/);if(hash){let v=D.versions.find(v=>v.id===Number(hash[1]));if(v){state.view='history';state.module=v.module;state.id=v.id;}}let initial=D.versions.find(v=>v.id===state.id);if(initial?.protos.length)state.page=firstContent(protoById(initial.protos[0]));render();
</script></body></html>
